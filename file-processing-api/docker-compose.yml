services:
  fastapi:
    build:
      context: .
      dockerfile: services/api_service/Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./storage:/storage
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: ${PYTHONPATH}

  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_client
    restart: always
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rag:
    container_name: rag
    build:
      context: .
      dockerfile: services/rag_service/Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./storage:/storage
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: ${PYTHONPATH}
#    command: rq worker rag

volumes:
  postgres_data:
  redis_data: